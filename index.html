<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#070012">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DEMO CRAZY">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DEMO CRAZY — Fest App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">



    <link rel="stylesheet" href="style.css">
<style id="dc-splash-style">
#dcSplash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050505;color:#fff;transition:opacity .55s ease,visibility .55s ease;}
#dcSplash.dc-hide{opacity:0;visibility:hidden;pointer-events:none;}
#dcSplash .dc-logo{width:min(180px,45vw);height:min(180px,45vw);object-fit:contain;animation:dcLogoIn 1s cubic-bezier(.2,.8,.2,1) both;}
#dcSplash .dc-title{margin-top:18px;font-family:Unbounded,system-ui,sans-serif;font-size:clamp(18px,5vw,28px);font-weight:800;letter-spacing:.08em;text-align:center;animation:dcTextIn 1s .12s ease both;}
#dcSplash .dc-subtitle{margin-top:8px;font-family:Inter,system-ui,sans-serif;font-size:clamp(11px,3.2vw,15px);font-weight:700;letter-spacing:.16em;text-align:center;opacity:.82;animation:dcTextIn 1s .22s ease both;}
@keyframes dcLogoIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@keyframes dcTextIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="dcSplash" aria-label="DEMO CRAZY loading">
  <img class="dc-logo" src="/icons/icon-512.png" alt="DEMO CRAZY">
  <div class="dc-title">DEMOCRAZY</div>
  <div class="dc-subtitle">MARKAZ ARTS FEST 2K26</div>
</div>
<script>
window.addEventListener('load',function(){setTimeout(function(){var s=document.getElementById('dcSplash');if(s)s.classList.add('dc-hide');},1600);});
</script>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand" onclick="nav('home')">
      <div class="brand-mark"></div>
      <div class="brand-name">DEMO CRAZY<span>Fest Companion</span></div>
    </div>
    <div class="top-actions">
      <button class="pill-btn" onclick="nav('contact')">Contact Us</button>
      <button class="icon-btn" onclick="toggleMenu(true)" aria-label="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 7H20M4 12H20M4 17H14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</header>

<div id="app" class="wrap"></div>

<div class="overlay" id="overlay" onclick="toggleMenu(false)"></div>
<div class="sidemenu" id="sidemenu">
  <button class="icon-btn close-x" onclick="toggleMenu(false)" aria-label="Close">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div style="clear:both;height:10px"></div>
  <h3>Menu</h3>
  <div id="sidemenu-items"></div>
</div>

<div class="modal-wrap" id="modalWrap">
  <div class="modal" id="modalBody"></div>
</div>

<div class="toast" id="toast"></div>

<nav class="bottomnav">
  <div class="bottomnav-inner" id="bottomnav-inner"></div>
</nav>




<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>








    <script src="app.js"></script>

</body>
</html>
