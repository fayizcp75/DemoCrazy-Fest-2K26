  --bg-soft:#0a0a0a;
  --elev:#121212;
  --card:#161616;
  --card2:#1e1e1e;
  --border:rgba(232,223,201,.10);
  --border-soft:rgba(232,223,201,.06);
  --text:#e8dfc9;
  --text-dim:#a89c7f;
  --text-faint:#6b6355;
  --accent:#d91f26;
  --accent-2:#ef4a45;
  --pink:#d91f26;
  --live:#d91f26;
  --gold:#e8dfc9;
  --silver:#cfd4e3;
  --bronze:#e0975c;
  --green:#3ddc97;
  --radius:22px;
  --radius-sm:14px;
  --ff-display:'Unbounded',sans-serif;
  --ff-body:'Inter',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--ff-body);}
body{
  min-height:100vh;
  background:
    radial-gradient(900px 500px at 15% -10%, rgba(217,31,38,.20), transparent 60%),
    radial-gradient(700px 500px at 100% 0%, rgba(217,31,38,.14), transparent 55%),
    var(--bg);
  padding-bottom:86px;
}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important;}}

::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--card2);border-radius:10px;}

a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;}

.wrap{max-width:520px;margin:0 auto;padding:0 16px;}
@media(min-width:860px){.wrap{max-width:900px;}}

/* ---------- HEADER ---------- */
header.topbar{
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(16px);
  background:rgba(8,7,13,.72);
  border-bottom:1px solid var(--border-soft);
}
.topbar-inner{max-width:520px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;}
@media(min-width:860px){.topbar-inner{max-width:900px;}}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
.brand-mark{
  width:38px;height:38px;border-radius:11px;
  background:#000 var(--logo-url) center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--ff-display);font-weight:800;font-size:15px;color:#050505;
  box-shadow:0 6px 18px -6px rgba(217,31,38,.65);
  overflow:hidden;
}
.brand-name{font-family:var(--ff-display);font-weight:700;font-size:14.5px;letter-spacing:.3px;line-height:1;}
.brand-name span{display:block;font-family:var(--ff-body);font-weight:600;font-size:9px;color:var(--text-dim);letter-spacing:1.5px;margin-top:3px;text-transform:uppercase;}
.top-actions{display:flex;align-items:center;gap:8px;}
.icon-btn{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--border);
  background:var(--elev);display:flex;align-items:center;justify-content:center;color:var(--text);
  transition:transform .15s ease, background .15s ease;
}
.icon-btn:active{transform:scale(.92);}
.pill-btn{
  display:flex;align-items:center;gap:6px;padding:0 14px;height:38px;border-radius:20px;
  border:1px solid var(--border);background:var(--elev);color:var(--text-dim);font-size:12.5px;font-weight:600;
}
.pill-btn:active{transform:scale(.96);}

/* side menu */
.overlay{position:fixed;inset:0;background:rgba(5,4,9,.65);backdrop-filter:blur(2px);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s ease;}
.overlay.show{opacity:1;pointer-events:auto;}
.sidemenu{
  position:fixed;top:0;right:-320px;width:280px;height:100%;z-index:61;
  background:var(--elev);border-left:1px solid var(--border);
  padding:20px;transition:right .28s cubic-bezier(.2,.8,.2,1);
  overflow-y:auto;
}
.sidemenu.show{right:0;}
.sidemenu h3{font-family:var(--ff-display);font-size:13px;margin:4px 0 14px;color:var(--text-dim);letter-spacing:.5px;text-transform:uppercase;}
.sidemenu .menu-item{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;font-weight:600;font-size:14.5px;color:var(--text);}
.sidemenu .menu-item:active{background:var(--card);}
.sidemenu .close-x{float:right;}

/* ---------- BOTTOM NAV ---------- */
nav.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:rgba(10,9,16,.85);backdrop-filter:blur(18px);
  border-top:1px solid var(--border-soft);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.bottomnav-inner{max-width:520px;margin:0 auto;display:flex;justify-content:space-around;}
@media(min-width:860px){.bottomnav-inner{max-width:900px;}}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px;border-radius:14px;color:var(--text-faint);flex:1;transition:color .15s ease;}
.nav-item svg{width:21px;height:21px;}
.nav-item span{font-size:10.5px;font-weight:600;}
.nav-item.active{color:var(--accent-2);}
.nav-item.active svg{filter:drop-shadow(0 0 8px rgba(239,74,69,.6));}
.nav-item:active{transform:scale(.92);}

/* ---------- GENERIC ---------- */
.page{padding:18px 0 30px;animation:fadeUp .35s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.page-title{font-family:var(--ff-display);font-weight:700;font-size:22px;margin:2px 0 4px;}
.page-sub{color:var(--text-dim);font-size:13px;margin:0 0 18px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;}
.section-head h2{font-family:var(--ff-display);font-size:15px;font-weight:600;margin:0;letter-spacing:.2px;}
.section-head .eyebrow{font-size:10.5px;color:var(--text-faint);letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin-bottom:3px;}
.link-more{font-size:12px;font-weight:700;color:var(--accent-2);display:flex;align-items:center;gap:4px;}

.card{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--radius);}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.6px;padding:4px 9px 4px 7px;border-radius:20px;text-transform:uppercase;}
.chip-live{background:rgba(217,31,38,.14);color:var(--live);border:1px solid rgba(217,31,38,.35);}
.chip-live .dot{width:6px;height:6px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite;}
.chip-upcoming{background:rgba(217,31,38,.14);color:var(--accent-2);border:1px solid rgba(217,31,38,.3);}
.chip-completed{background:rgba(61,220,151,.12);color:var(--green);border:1px solid rgba(61,220,151,.28);}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,31,38,.55);}70%{box-shadow:0 0 0 7px rgba(217,31,38,0);}100%{box-shadow:0 0 0 0 rgba(217,31,38,0);}}

.empty{text-align:center;padding:40px 20px;color:var(--text-dim);}
.empty svg{width:40px;height:40px;margin-bottom:10px;color:var(--text-faint);}
.empty b{display:block;color:var(--text);font-family:var(--ff-display);font-size:14px;margin-bottom:4px;}

/* ---------- LIVE HERO ---------- */
.hero-live{
  position:relative;overflow:hidden;border-radius:26px;padding:22px 20px 24px;
  background:radial-gradient(140% 140% at 15% 0%, rgba(217,31,38,.28), transparent 55%), linear-gradient(160deg,#181818,#0a0a0a);
  border:1px solid rgba(217,31,38,.25);
}
.hero-live::after{
  content:'';position:absolute;top:-60px;right:-60px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(217,31,38,.35),transparent 70%);filter:blur(10px);
}
.hero-live .eyebrow-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.hero-live h3{font-family:var(--ff-display);font-size:19px;margin:0 0 6px;line-height:1.25;position:relative;z-index:1;}
.hero-live p{margin:0;color:var(--text-dim);font-size:12.5px;position:relative;z-index:1;}
.hero-none{padding:26px 20px;border-radius:26px;text-align:center;border:1px dashed var(--border);color:var(--text-dim);font-size:13px;}

/* ---------- HOME LIVE + NEXT ---------- */
.home-live-next-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
.home-card-head{margin:4px 0 12px;}
.home-card-head .link-more{font-size:12px;}
.home-live-next-grid > div{min-width:0;}
.home-live-next-grid .hero-live{height:150px;min-height:0;box-sizing:border-box;}
.next-as-live{display:flex;flex-direction:column;justify-content:flex-start;}
.latest-announcement-highlight{position:relative;overflow:hidden;margin-top:14px;border-radius:26px;padding:18px 20px;background:radial-gradient(140% 140% at 15% 0%,rgba(217,31,38,.28),transparent 55%),linear-gradient(160deg,#181818,#0a0a0a);border:1px solid rgba(217,31,38,.25);}
.latest-announcement-highlight::after{content:'';position:absolute;top:-60px;right:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(217,31,38,.35),transparent 70%);filter:blur(10px);}
.latest-announcement-highlight .lah-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;position:relative;z-index:1;}
.latest-announcement-highlight .eyebrow{font-size:10.5px;color:var(--accent-2);letter-spacing:1.5px;text-transform:uppercase;font-weight:800;}
.latest-announcement-highlight h3{font-family:var(--ff-display);font-size:16px;margin:0 0 6px;line-height:1.3;position:relative;z-index:1;}
.latest-announcement-highlight p{margin:0;color:var(--text-dim);font-size:12.5px;line-height:1.5;position:relative;z-index:1;}

@media(max-width:390px){.home-live-next-grid{gap:10px;}.home-live-next-grid .hero-live{padding:18px 14px 18px;height:150px;min-height:0;box-sizing:border-box;}.hero-live h3{font-size:16px;}.hero-live p{font-size:11.5px;}.cd-box{padding:8px 2px;}.cd-box b{font-size:14px;}.cd-box small{font-size:8px;}}

.next-card{
  position:relative;overflow:hidden;border-radius:26px;padding:22px 20px 24px;
  background:radial-gradient(140% 140% at 15% 0%, rgba(217,31,38,.28), transparent 55%), linear-gradient(160deg,#181818,#0a0a0a);
  border:1px solid rgba(217,31,38,.25);
}
.next-card::after{
  content:'';position:absolute;top:-60px;right:-60px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(217,31,38,.35),transparent 70%);filter:blur(10px);
}
.next-card .eyebrow{font-size:10.5px;color:var(--accent-2);letter-spacing:1.5px;text-transform:uppercase;font-weight:800;margin-bottom:14px;position:relative;z-index:1;}
.next-card h3{font-family:var(--ff-display);font-size:19px;margin:0 0 12px;line-height:1.25;position:relative;z-index:1;}
.next-meta{display:flex;gap:16px;color:var(--text-dim);font-size:12.5px;margin-bottom:16px;flex-wrap:wrap;position:relative;z-index:1;}
.next-meta span{display:flex;align-items:center;gap:5px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13px;border-radius:14px;padding:11px 18px;border:none;transition:transform .15s ease,filter .15s ease;}
.btn:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--pink));color:#fff;box-shadow:0 8px 20px -8px rgba(217,31,38,.55);}
.btn-ghost{background:var(--elev);color:var(--text);border:1px solid var(--border);}
.btn-block{width:100%;}
.btn-sm{padding:8px 14px;font-size:12px;border-radius:11px;}
.btn-danger{background:rgba(217,31,38,.14);color:var(--live);border:1px solid rgba(217,31,38,.3);}

/* ---------- RANK ROWS ---------- */
.rank-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--border-soft);margin-bottom:9px;}
.rank-row:active{transform:scale(.99);}
.rank-num{
  width:38px;height:38px;flex:none;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;

  border:1px solid rgba(255,255,255,.24);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 -5px 10px rgba(0,0,0,.18),
    0 5px 14px rgba(0,0,0,.28);
  text-shadow:0 1px 1px rgba(255,255,255,.35);
}
.rank-num::before{
  content:"";position:absolute;inset:3px;border-radius:9px;
  border:1px solid rgba(255,255,255,.28);pointer-events:none;
}
.rank-num::after{
  content:"";position:absolute;width:22px;height:7px;
  top:3px;left:-8px;transform:rotate(-28deg);
  background:rgba(255,255,255,.28);filter:blur(2px);pointer-events:none;
}
.rank-num.r1{
  background:linear-gradient(145deg,#fff0a6 0%,#f5c64b 38%,#c98a20 72%,#8e5a12 100%);
  color:#3a2605;border-color:rgba(255,224,120,.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -6px 12px rgba(91,53,0,.25),0 0 0 2px rgba(245,198,75,.10),0 6px 18px rgba(245,198,75,.22);
}
.rank-num.r2{
  background:linear-gradient(145deg,#fff 0%,#dfe4ef 38%,#aeb8ce 70%,#717c98 100%);
  color:#202636;border-color:rgba(255,255,255,.65);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -6px 12px rgba(54,63,85,.18),0 0 0 2px rgba(210,218,235,.08),0 6px 18px rgba(190,200,220,.15);
}
.rank-num.r3{
  background:linear-gradient(145deg,#ffd09a 0%,#d98b48 38%,#a95f2c 70%,#70401f 100%);
  color:#301a0b;border-color:rgba(255,192,120,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -6px 12px rgba(72,32,8,.22),0 0 0 2px rgba(217,139,72,.08),0 6px 18px rgba(190,105,45,.16);
}
.rank-info{flex:1;min-width:0;}
.rank-info .name{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank-info .sub{font-size:11px;color:var(--text-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank-pts{flex:none;text-align:right;}
.rank-pts b{font-family:var(--ff-display);font-size:14.5px;color:var(--accent-2);}
.rank-pts small{display:block;font-size:9px;color:var(--text-faint);letter-spacing:.5px;text-transform:uppercase;}
.avatar{width:36px;height:36px;border-radius:11px;flex:none;background:linear-gradient(145deg,var(--card2),var(--elev));border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--ff-display);font-size:12px;font-weight:700;color:var(--text-dim);}

/* ---------- TICKET CARD (signature element) ---------- */
.ticket{
  display:flex;border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--border-soft);margin-bottom:12px;position:relative;
}
.ticket:active{transform:scale(.99);}
.ticket-stub{
  width:78px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(165deg,rgba(217,31,38,.16),rgba(217,31,38,.10));
  padding:10px 4px;position:relative;
}
.ticket-stub .mon{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent-2);font-weight:800;}
.ticket-stub .day{font-family:var(--ff-display);font-size:22px;font-weight:800;line-height:1.1;margin:2px 0;}
.ticket-stub .time{font-size:10px;color:var(--text-dim);font-weight:600;}
.ticket-perf{
  width:0;border-left:2px dashed rgba(255,255,255,.14);position:relative;
}
.ticket-perf::before,.ticket-perf::after{
  content:'';position:absolute;left:-7px;width:14px;height:14px;border-radius:50%;background:var(--bg-soft);
}
.ticket-perf::before{top:-7px;}
.ticket-perf::after{bottom:-7px;}
.ticket-body{flex:1;padding:12px 14px;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px;}
.ticket-body .tname{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ticket-body .trow{display:flex;align-items:center;justify-content:space-between;gap:8px;}

/* Results podium block */
.result-block{margin-bottom:16px;}
.result-block .ev-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.result-block .ev-head h3{font-family:var(--ff-display);font-size:14.5px;margin:0;}
.podium-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;margin-bottom:7px;border:1px solid var(--border-soft);}
.podium-row.p1{background:linear-gradient(90deg,rgba(255,200,87,.13),transparent);}
.podium-row.p2{background:linear-gradient(90deg,rgba(207,212,227,.10),transparent);}
.podium-row.p3{background:linear-gradient(90deg,rgba(224,151,92,.11),transparent);}
.medal{
  width:38px;height:38px;border-radius:12px;flex:none;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  font-size:15px;font-weight:900;font-family:var(--ff-display);
  border:1px solid rgba(255,255,255,.24);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 -5px 10px rgba(0,0,0,.18),

}
.medal::before{

  border:1px solid rgba(255,255,255,.28);

}

  top:3px;left:-8px;transform:rotate(-28deg);
  background:rgba(255,255,255,.28);filter:blur(2px);
  pointer-events:none;
}
.medal.g{

  border-color:rgba(255,224,120,.7);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.8),
    inset 0 -6px 12px rgba(91,53,0,.25),
    0 0 0 2px rgba(245,198,75,.10),
    0 6px 18px rgba(245,198,75,.22);
}
.medal.s{
  background:linear-gradient(145deg,#ffffff 0%,#dfe4ef 38%,#aeb8ce 70%,#717c98 100%);
  color:#202636;
  border-color:rgba(255,255,255,.65);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.9),
    inset 0 -6px 12px rgba(54,63,85,.18),
    0 0 0 2px rgba(210,218,235,.08),
    0 6px 18px rgba(190,200,220,.15);
}
.medal.b{

  color:#301a0b;
  border-color:rgba(255,192,120,.55);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.65),
    inset 0 -6px 12px rgba(72,32,8,.22),
    0 0 0 2px rgba(217,139,72,.08),
    0 6px 18px rgba(190,105,45,.16);
}

/* grid stats */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.stat-card{padding:16px;text-align:left;}
.stat-card .n{font-family:var(--ff-display);font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--accent-2),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;}
.stat-card .l{font-size:11px;color:var(--text-dim);margin-top:4px;font-weight:600;}

/* teams grid */
.team-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.team-card{padding:16px 14px;text-align:left;position:relative;overflow:hidden;}
.team-card .tc-badge{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-family:var(--ff-display);font-weight:800;font-size:15px;margin-bottom:10px;color:#050505;}
.team-card .tc-name{font-weight:700;font-size:13.5px;margin-bottom:3px;}
.team-card .tc-pts{font-size:11px;color:var(--text-dim);}
.team-card .tc-rank{position:absolute;top:12px;right:12px;font-family:var(--ff-display);font-size:11px;color:var(--text-faint);}

/* search bar */
.searchbar{display:flex;align-items:center;gap:10px;background:var(--elev);border:1px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:16px;}
.searchbar input{flex:1;background:transparent;border:none;color:var(--text);font-size:14px;outline:none;}
.searchbar input::placeholder{color:var(--text-faint);}

/* form */
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.field input,.field select,.field textarea{
  width:100%;background:var(--elev);border:1px solid var(--border);border-radius:12px;padding:11px 13px;color:var(--text);font-size:14px;outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
.field textarea{resize:vertical;min-height:80px;}
.hint-box{background:var(--elev);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:12.5px;color:var(--text-dim);}

.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.leader-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
.tag-check{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:20px;border:1px solid var(--border);background:var(--elev);font-size:12px;font-weight:600;color:var(--text-dim);}
.tag-check.on{background:rgba(217,31,38,.18);border-color:var(--accent);color:var(--text);}

/* modal */

.modal-wrap.show{opacity:1;pointer-events:auto;}

.modal{width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:var(--elev);border:1px solid var(--border);border-radius:26px 26px 0 0;padding:22px 20px 26px;transform:translateY(30px);transition:transform .25s cubic-bezier(.2,.8,.2,1);}

.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-head h3{font-family:var(--ff-display);font-size:16px;margin:0;}

.committee-card .role{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;color:var(--accent-2);}
.committee-card .cc-row{display:flex;align-items:center;gap:12px;}
.committee-card .cc-avatar{width:52px;height:52px;border-radius:15px;background:linear-gradient(145deg,var(--accent),var(--pink));display:flex;align-items:center;justify-content:center;font-family:var(--ff-display);font-weight:800;font-size:17px;color:#050505;flex:none;}
.committee-card .cc-name{font-weight:700;font-size:14.5px;}
.committee-card .cc-phone{font-size:12.5px;color:var(--text-dim);margin-top:2px;display:flex;align-items:center;gap:5px;}


.latest-announcement-highlight{
  position:relative;overflow:hidden;width:100%;box-sizing:border-box;margin:16px 0 22px;
  border-radius:22px;padding:16px 18px;
  background:radial-gradient(120% 160% at 10% 0%, rgba(217,31,38,.25), transparent 58%),linear-gradient(160deg,#181818,#0a0a0a);

  background:radial-gradient(circle,rgba(217,31,38,.28),transparent 70%);filter:blur(8px);pointer-events:none;

.latest-announcement-highlight .lah-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;position:relative;z-index:1;}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================= ICONS ============================= */
const ICONS = {
  home:'<path d="M4 11L12 4L20 11V19A1 1 0 0 1 19 20H15V14H9V20H5A1 1 0 0 1 4 19V11Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
  events:'<rect x="4" y="5.5" width="16" height="15" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M8 3.5V7M16 3.5V7M4 10H20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  results:'<path d="M8 21H16M12 17V21M6 4H18V9A6 6 0 0 1 6 9V4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M6 6H3V8A3 3 0 0 0 6 11M18 6H21V8A3 3 0 0 1 18 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',

  chevronR:'<path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',

  megaphone:'<path d="M3 10V14A1 1 0 0 0 4 15H6L13 20V4L6 9H4A1 1 0 0 0 3 10Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M17 9A4 4 0 0 1 17 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  info:'<circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8"/><path d="M12 11V16.5M12 8V8.05" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>',

  plus:'<path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
  edit:'<path d="M4 20L4.6 16.7L15.4 5.9C15.9 5.4 16.7 5.4 17.2 5.9L18.1 6.8C18.6 7.3 18.6 8.1 18.1 8.6L7.3 19.4L4 20Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>',
  phone:'<path d="M6 3H9L10.5 7L8.5 8.5C9.2 10.5 10.5 11.8 12.5 12.5L14 10.5L18 12V15C18 16.1 17.1 17 16 17C9.9 16.6 5.4 12.1 5 6C5 4.9 5.9 3 6 3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>',
  users:'<circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 19A5.5 5.5 0 0 1 13.5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M15 4A3.5 3.5 0 0 1 15 11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M16.5 13.2A5.5 5.5 0 0 1 21.5 18.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>',
  award:'<circle cx="12" cy="8" r="5.2" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 12.5L7 21L12 18.5L17 21L15.5 12.5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
  doc:'<path d="M6 3H14L18 7V21H6V3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3V7H18" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12H15M9 15.5H15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  check:'<path d="M5 12.5L10 17L19 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
  x:'<path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  crown:'<path d="M4 8L8 11L12 5L16 11L20 8L18.5 18H5.5L4 8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>',
  trash:'<path d="M5 7H19M9 7V4.8C9 4.4 9.4 4 9.8 4H14.2C14.6 4 15 4.4 15 4.8V7M7 7L7.7 19C7.7 19.6 8.2 20 8.8 20H15.2C15.8 20 16.3 19.6 16.3 19L17 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>',
};
function ic(name,size=18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none">${ICONS[name]||''}</svg>`;}

/* ============================= DATA ============================= */
let DB = {
  events:[],
  teams:[],
  participants:[],
  results:[],
  announcements:[],
  committee:[]
};

/* ============================= ADMIN ACCOUNTS ============================= */
let ADMINS = [];
let CURRENT_ADMIN = null;
let SEQ_ADMIN = 10;
const adminUid = () => 'adm' + (SEQ_ADMIN++);

let SEQ = 100;
const uid = p => p + (SEQ++);

/* recompute participant + team points from results */
function recalc(){
  DB.participants.forEach(p=>p.points=0);
  DB.results.forEach(r=>{
    const p = DB.participants.find(x=>x.id===r.participantId);
    if(p) p.points += r.points;
  });
}
recalc();

function team(id){return DB.teams.find(t=>t.id===id);}
function participant(id){return DB.participants.find(p=>p.id===id);}
function event_(id){return DB.events.find(e=>e.id===id);}
function teamPoints(teamId){return DB.participants.filter(p=>p.teamId===teamId).reduce((s,p)=>s+p.points,0);}
function rankedTeams(){return [...DB.teams].map(t=>({...t,points:teamPoints(t.id)})).sort((a,b)=>b.points-a.points);}
function rankedParticipants(){return [...DB.participants].sort((a,b)=>b.points-a.points);}
function initials(name){return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function fmtDate(d){const dt=new Date(d+'T00:00:00');return dt.toLocaleDateString('en-IN',{day:'numeric',month:'short'});}
function fmtTime(t){const [h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';const hh=((h+11)%12)+1;return `${hh}:${String(m).padStart(2,'0')} ${ap}`;}
function fmtDateTime(iso){const dt=new Date(iso);return dt.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+' · '+dt.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});}
function statusChip(s){
  if(s==='LIVE') return `<span class="chip chip-live"><span class="dot"></span>Live</span>`;
  if(s==='UPCOMING') return `<span class="chip chip-upcoming">Upcoming</span>`;
  return `<span class="chip chip-completed">Completed</span>`;
}
function medalIcon(pos){return pos===1?'g':pos===2?'s':'b';}
function medalLabel(pos){return pos===1?'1st':pos===2?'2nd':'3rd';}

/* ============================= STATE / ROUTER ============================= */
let STATE = {route:'home', params:{}, adminLoggedIn:false, resultsTab:null, leaderboardTab:'teams'};

function nav(route, params={}){
  STATE.route = route; STATE.params = params;
  toggleMenu(false);
  window.scrollTo({top:0,behavior:'instant'});
  render();
}
function toggleMenu(show){
  document.getElementById('overlay').classList.toggle('show', show);
  document.getElementById('sidemenu').classList.toggle('show', show);
}
function toast(msg){
  const t=document.getElementById('toast');
  t.innerHTML = ic('check',14)+`<span>${msg}</span>`;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}
function closeModal(){document.getElementById('modalWrap').classList.remove('show'); document.getElementById('modalBody').innerHTML='';}
function openModal(html){document.getElementById('modalBody').innerHTML=html; document.getElementById('modalWrap').classList.add('show');}

/* ============================= BOTTOM NAV + SIDE MENU ============================= */
const BOTTOM_TABS = [
  {id:'home', label:'Home', icon:'home'},
  {id:'events', label:'Events', icon:'events'},
  {id:'results', label:'Results', icon:'results'},
  {id:'leaderboard', label:'Leaderboard', icon:'leaderboard'},
  {id:'more', label:'More', icon:'more'},
];
function renderBottomNav(){
  const active = ['home','events','results','leaderboard'].includes(STATE.route) ? STATE.route :
    (['more','teams','team-detail','announcements','schedule','search','committee','admin','admin-dash','admin-participants','admin-teams','admin-events','admin-registrations','admin-results','admin-announcements','admin-committee','admin-report','admin-management'].includes(STATE.route) ? 'more' : '');
  document.getElementById('bottomnav-inner').innerHTML = BOTTOM_TABS.map(t=>`
    <a class="nav-item ${active===t.id?'active':''}" onclick="nav('${t.id}')">
      ${ic(t.icon,21)}<span>${t.label}</span>
    </a>`).join('');
}
const SIDE_ITEMS = [
  {id:'teams', label:'Teams', icon:'team'},
  {id:'announcements', label:'Announcements', icon:'megaphone'},
  {id:'schedule', label:'Schedule', icon:'calendar'},
  {id:'search', label:'Search Participant', icon:'search'},
  {id:'committee', label:'Contact Us', icon:'phone'},
  {id:'about', label:'About', icon:'info'},
  {id:'admin', label:'Admin', icon:'shield'},
];
document.getElementById('sidemenu-items').innerHTML = SIDE_ITEMS.map(i=>`
  <a class="menu-item" onclick="nav('${i.id}')">${ic(i.icon,18)}${i.label}</a>`).join('');

/* ============================= RENDER ROOT ============================= */
function render(){
  renderBottomNav();
  const app = document.getElementById('app');
  const routes = {
    home: pageHome, events: pageEvents, 'event-details': pageEventDetails, results: pageResults, leaderboard: pageLeaderboard,
    more: pageMore, teams: pageTeams, 'team-detail': pageTeamDetail, announcements: pageAnnouncements,
    schedule: pageSchedule, search: pageSearch, committee: pageCommittee, about: pageAbout,
    admin: pageAdminLogin, 'admin-dash': pageAdminDash,
    'admin-participants': pageAdminParticipants, 'admin-teams': pageAdminTeams,
    'admin-events': pageAdminEvents, 'admin-registrations': pageAdminRegistrations,
    'admin-results': pageAdminResults, 'admin-announcements': pageAdminAnnouncements,
    'admin-committee': pageAdminCommittee, 'admin-report': pageAdminReport, 'admin-management': pageAdminManagement,
  };
  const fn = routes[STATE.route] || pageHome;
  app.innerHTML = `<div class="page">${fn()}</div>`;
}
function backHead(title, to){
  return `<div class="subpage-head"><button class="icon-btn" onclick="nav('${to}')">${ic('back',18)}</button><h1>${title}</h1></div>`;
}

/* ============================= HOME ============================= */
function pageHome(){
  const live = DB.events.find(e=>e.status==='LIVE');
  const upcoming = DB.events.filter(e=>e.status==='UPCOMING').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
  const topTeams = rankedTeams().slice(0,3);
  const topParts = rankedParticipants().slice(0,3);
  const latest = DB.results.slice().reverse().slice(0,3);
  const latestEventId = latest.length ? latest[0].eventId : null;
  const latestEvent = latestEventId ? event_(latestEventId) : null;
  const latestEventResults = latestEventId ? DB.results
    .filter(r=>r.eventId===latestEventId)
    .sort((a,b)=>{
      const rank = r => r.position ? Number(r.position) : 999;
      return rank(a)-rank(b);
    })
    .slice(0,6) : [];

  return `
  <p class="page-sub" style="margin-bottom:16px;">Welcome back — here's what's happening right now.</p>

  <div class="home-live-next-grid">
    <div>
      <div class="section-head home-card-head"><div><div class="eyebrow">Live now</div><h2>Live</h2></div></div>
      ${live ? `
      <div class="hero-live">
        <div class="eyebrow-row">${statusChip('LIVE')}<span style="font-size:11px;color:var(--text-dim);">Main Stage</span></div>
        <h3>${live.name}</h3>
        <p>In progress · started ${fmtTime(live.time)} today</p>
      </div>` : `<div class="hero-none">No event is live right now — check Events for what's next.</div>`}
    </div>

    <div>
      <div class="section-head home-card-head"><div><div class="eyebrow">Coming up</div><h2>Next</h2></div><a class="link-more" onclick="nav('events')">View All ${ic('chevronR',14)}</a></div>

  const res = DB.results.filter(r=>r.eventId===e.id).sort((a,b)=>{

  });
  return `
  <div class="result-block">
    <div class="ev-head"><h3>${e.name}</h3>${statusChip(e.status)}</div>
    ${res.map(r=>{
      const p=participant(r.participantId);

    }).join('')}

}

        <div class="field"><label>Username</label><input id="au" required autocomplete="username"></div>
        <div class="field"><label>Password</label><input id="ap" type="password" required autocomplete="current-password"></div>

function doAdminLogin(ev){
  ev.preventDefault();
  const u=document.getElementById('au').value.trim();
  const p=document.getElementById('ap').value;
  const account=ADMINS.find(a=>a.username===u && a.password===p);
  if(account){ CURRENT_ADMIN={...account}; STATE.adminLoggedIn=true; toast(`Welcome back, ${account.name}`); nav('admin-dash'); }
  else toast('Invalid credentials');
}
function adminLogout(){ CURRENT_ADMIN=null; STATE.adminLoggedIn=false; toast('Logged out'); nav('home'); }
function isSuperAdmin(){ return !!CURRENT_ADMIN && CURRENT_ADMIN.role==='SUPER'; }
function requireAdmin(body){ if(!STATE.adminLoggedIn || !CURRENT_ADMIN) return pageAdminLogin(); return body(); }
function requireSuperAdmin(body){
  if(!STATE.adminLoggedIn || !CURRENT_ADMIN) return pageAdminLogin();
  if(!isSuperAdmin()) return `${backHead('Access Denied','admin-dash')}<div class="card" style="padding:22px;text-align:center;"><div style="font-size:32px;margin-bottom:10px;">🔒</div><b>Super Admin access required</b><p style="color:var(--text-dim);font-size:12px;line-height:1.6;">Normal Admin accounts can manage Results and Announcements only.</p><button class="btn btn-primary btn-block" onclick="nav('admin-dash')">Back to Dashboard</button></div>`;
  return body();
}

function renderSelectedEventRegistrations(){

window._registrations = window._registrations || [];
function renderRegList(){
  if(!window._registrations.length) return `<div class="empty">No registrations yet.</div>`;
  return window._registrations.slice().reverse().map(r=>{
    const p=participant(r.pid), e=event_(r.eid);
    return `<div class="rank-row"><div class="avatar">${initials(p.name)}</div>
    <div class="rank-info"><div class="name">${p.name} · #${p.chest}</div><div class="sub">${e.name}</div></div></div>`;
  }).join('');
}
function regLookup(){
  const chest=document.getElementById('reg-chest').value.trim();
  const eid=document.getElementById('reg-event').value;
  const p=DB.participants.find(x=>x.chest===chest);
  const already=p && (window._registrations||[]).some(r=>r.eid===eid && r.pid===p.id);
  document.getElementById('reg-preview').innerHTML = p
    ? (already
      ? `<div class="hint-box" style="border-color:rgba(255,184,77,.35);"><b>${p.name}</b> · #${p.chest}<br><span style="color:var(--flare);">Already registered for this event.</span></div>`
      : `<div class="hint-box"><b>${p.name}</b> · ${team(p.teamId)?.name}</div>`)
    : (chest ? `<div class="hint-box">No participant found for chest #${chest}</div>` : '');
}

function doRegister(){
  const eid=document.getElementById('reg-event').value;
  const chest=document.getElementById('reg-chest').value.trim();
  const p=DB.participants.find(x=>x.chest===chest);
  if(!p){ toast('No participant with that chest number'); return; }

  const exists=(window._registrations||[]).some(r=>r.eid===eid && r.pid===p.id);
  if(exists){
    const box=document.getElementById('reg-preview');
    if(box) box.innerHTML=`<div class="hint-box" style="border-color:rgba(255,184,77,.35);"><b>${p.name}</b> · #${p.chest}<br><span style="color:var(--flare);">Already registered for this event.</span></div>`;
    toast('Already registered for this event');
    return;
  }

  window._registrations.push({eid,pid:p.id});
  toast('Registered '+p.name);
  document.getElementById('reg-chest').value='';
  document.getElementById('reg-preview').innerHTML='';
  renderSelectedEventRegistrations();
}

        const p=participant(r.participantId);
        return `<tr>
          <td>${event_(r.eventId).name}</td>
          <td>${prizeLabel(r.position)}</td>
          <td>${r.grade || 'NO GRADE'}</td>
          <td>${p.name} #${p.chest}</td>

}
function syncResultPoints(){
  const prize=document.getElementById('res-prize')?.value;
  const points=document.getElementById('res-points');
  if(!points) return;
  points.value = prize==='1' ? 10 : prize==='2' ? 7 : prize==='3' ? 5 : 0;
}
function resLookup(){
  const chest=document.getElementById('res-chest').value.trim();
  const p=DB.participants.find(x=>x.chest===chest);
  document.getElementById('res-preview').innerHTML = p
    ? `<div class="hint-box"><b>${p.name}</b> · ${team(p.teamId)?.name}</div>`
    : (chest ? `<div class="hint-box">No participant found for chest #${chest}</div>` : '');
}
function doSaveResult(){
  const eid=document.getElementById('res-event').value;
  const chest=document.getElementById('res-chest').value.trim();
  const prize=document.getElementById('res-prize').value;
  const grade=document.getElementById('res-grade').value || '';
  const position=prize ? Number(prize) : 0;
  const points=Number(document.getElementById('res-points').value)||0;
  const p=DB.participants.find(x=>x.chest===chest);
  if(!p){ toast('No participant with that chest number'); return; }

  const existing = DB.results.find(r=>r.eventId===eid && r.participantId===p.id);
  if(existing){
    existing.position=position;
    existing.prize=prize;
    existing.grade=grade;
    existing.points=points;
  } else {
    DB.results.push({id:uid('r'),eventId:eid,position,prize,grade,participantId:p.id,points});
  }

  recalc();
  toast('Result saved · leaderboards updated');
  document.getElementById('res-chest').value='';
  document.getElementById('res-preview').innerHTML='';
  render();
}

    if(pendingContactPhoto) c.photo=pendingContactPhoto;
    else delete c.photo;
    toast('Contact updated');

async function sbLoadTable(table, order='created_at'){
  const q=sb.from(table).select('*');
  if(order) q.order(order,{ascending:true});
  const {data,error}=await q;
  if(error) throw error;
  return data||[];
}
async function loadRemoteDB(){
  const [events,teams,participants,results,announcements,committee,registrations]=await Promise.all([
    sbLoadTable('events'), sbLoadTable('teams'), sbLoadTable('participants'), sbLoadTable('results'),
    sbLoadTable('announcements','date'), sbLoadTable('committee'), sbLoadTable('registrations')
  ]);
  DB.events=events.map(e=>({id:e.id,name:e.name,date:e.event_date||'',time:e.event_time||'',status:e.status||'UPCOMING',details:e.details||'',venue:e.venue||''}));
  DB.teams=teams.map(t=>({id:t.id,name:t.name,color:t.color||'#d91f26',leaderIds:Array.isArray(t.leader_ids)?t.leader_ids:[]}));
  DB.participants=participants.map(p=>({id:p.id,name:p.name,chest:p.chest||'',teamId:p.team_id,points:Number(p.points)||0,phone:p.phone||''}));
  DB.results=results.map(r=>({id:r.id,eventId:r.event_id,position:Number(r.position)||0,participantId:r.participant_id,points:Number(r.points)||0,grade:r.grade||'',prize:r.prize||''}));
  DB.announcements=announcements.map(a=>({id:a.id,title:a.title,message:a.message||'',date:a.date}));

  recalc();
}

async function saveAdmin(ev,id){
  ev.preventDefault();
  const name=document.getElementById('ad-name').value.trim();
  const username=document.getElementById('ad-user').value.trim();
  const password=document.getElementById('ad-pass').value;
  const role=document.getElementById('ad-role').value;
  const action=id?'update':'create';
  const body={action,name,username,role};
  if(id) body.id=id;
  if(password) body.password=password;
  const {data,error}=await sb.functions.invoke('admin-management',{body});
  if(error){
    console.error(error);
    toast(data?.error || error.message || 'Could not save admin');
    return;
  }
  closeModal();
  await loadRemoteAdmins();
  if(id===CURRENT_ADMIN?.id){
    const a=ADMINS.find(x=>x.id===id);
    if(a) CURRENT_ADMIN={...CURRENT_ADMIN,...a};
  }
  render();
  toast(id?'Admin updated':'Admin added');
}

async function deleteAdmin(id){
  if(id===CURRENT_ADMIN?.id){toast('This admin cannot be deleted');return;}
  const a=ADMINS.find(x=>x.id===id);
  if(!a)return;
  const {data,error}=await sb.functions.invoke('admin-management',{body:{action:'delete',id}});
  if(error){
    console.error(error);
    toast(data?.error || error.message || 'Could not delete admin');
    return;
  }
  await loadRemoteAdmins();
  render();
  toast(`${a.name} deleted`);
}

};
